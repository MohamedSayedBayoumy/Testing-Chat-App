name: Check for errors, warnings, and lints

on:
  pull_request:
    branches: [ "refact-based-course" ]

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          cache: true
          cache-dependency-path: pubspec.lock

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Code Quality
        run: flutter analyze

      - name: Run Unit & Widget Tests
        run: flutter test
