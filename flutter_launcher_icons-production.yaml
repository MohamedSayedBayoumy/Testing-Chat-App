flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/ic_launcher_prod.jpg"
  min_sdk_android: 21
  remove_alpha_ios: true

  # Adaptive icon (Android 8+)
  adaptive_icon_background: "#0D47A1"
  adaptive_icon_foreground: "assets/icons/ic_launcher_prod.jpg"

  # Web favicon
  web:
    generate: true
    image_path: "assets/icons/ic_launcher_prod.jpg"
